<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Course Enrollment System</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-pink-300 min-h-screen">

    <!-- Header -->
    <header class="text-center py-6 px-4">
        <h1 class="font-bold text-pink-900 text-3xl sm:text-4xl md:text-5xl">
            Student Course Enrollment System
        </h1>
    </header>


    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-10">

        <div class="flex flex-col lg:flex-row gap-6">


            <section class="w-full lg:w-1/3">

                <div class="bg-white rounded-xl shadow-lg p-5">

                    <h2 class="text-2xl font-bold text-pink-900 mb-5">
                        Student Information
                    </h2>


                    <!-- Add Student -->
                    <div class="mb-6">

                        <h3 class="text-lg font-bold text-gray-700 mb-3">
                            Add Student
                        </h3>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Student Name"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 mb-3
                                   focus:outline-none focus:ring-2 focus:ring-pink-400"
                        >

                        <button
                            id="addStudent"
                            class="w-full bg-pink-500 hover:bg-pink-600
                                   text-white font-bold py-2 rounded-md transition"
                        >
                            Add Student
                        </button>

                    </div>


                    <!-- Add Course -->
                    <div class="mb-6">

                        <h3 class="text-lg font-bold text-gray-700 mb-3">
                            Add Course
                        </h3>

                        <input
                            type="text"
                            id="courseName"
                            placeholder="Course Name"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 mb-3
                                   focus:outline-none focus:ring-2 focus:ring-pink-400"
                        >

                        <button
                            id="addCourse"
                            class="w-full bg-pink-500 hover:bg-pink-600
                                   text-white font-bold py-2 rounded-md transition"
                        >
                            Add Course
                        </button>

                    </div>


                    <!-- Enrollment -->
                    <div>

                        <h3 class="text-lg font-bold text-gray-700 mb-3">
                            Course Enrollment
                        </h3>

                        <select
                            id="studentSelect"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 mb-3"
                        >
                            <option value="">Select Student</option>
                        </select>


                        <select
                            id="courseSelect"
                            class="w-full border border-gray-300 rounded-md px-3 py-2 mb-3"
                        >
                            <option value="">Select Course</option>
                        </select>


                        <div class="flex flex-col sm:flex-row gap-3">

                            <button
                                id="enroll"
                                class="w-full bg-green-500 hover:bg-green-600
                                       text-white font-bold py-2 rounded-md transition"
                            >
                                Enroll
                            </button>

                            <button
                                id="removeEnrollment"
                                class="w-full bg-red-500 hover:bg-red-600
                                       text-white font-bold py-2 rounded-md transition"
                            >
                                Remove
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <section class="w-full lg:w-2/3">

                <div class="bg-white rounded-xl shadow-lg p-5">

                    <div class="flex flex-col sm:flex-row
                                sm:justify-between sm:items-center
                                gap-3 mb-5">

                        <h2 class="text-2xl font-bold text-pink-900">
                            Students
                        </h2>

                        <input
                            type="text"
                            id="search"
                            placeholder="Search student..."
                            class="border border-gray-300 rounded-md
                                   px-3 py-2 w-full sm:w-64
                                   focus:outline-none focus:ring-2
                                   focus:ring-pink-400"
                        >

                    </div>


                    <!-- Table -->
                    <div class="overflow-x-auto">

                        <table class="w-full min-w-[600px]">

                            <thead class="bg-pink-100">

                                <tr>

                                    <th class="px-4 py-3 text-left">
                                        ID
                                    </th>

                                    <th class="px-4 py-3 text-left">
                                        Student
                                    </th>

                                    <th class="px-4 py-3 text-left">
                                        Courses
                                    </th>

                                    <th class="px-4 py-3 text-left">
                                        Actions
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="studentTable">

                                <tr>

                                    <td
                                        colspan="4"
                                        class="text-center py-8 text-gray-500"
                                    >
                                        No students added yet
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </section>

        </div>

    </main>
<script src="script.js"></script>
</body>
</html>
